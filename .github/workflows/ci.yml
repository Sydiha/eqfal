name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    # Throwaway database for the PostgreSQL-backed server tests (no external service, no cost).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eqfal
          POSTGRES_PASSWORD: eqfal_ci
          POSTGRES_DB: eqfal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eqfal -d eqfal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eqfal:eqfal_ci@127.0.0.1:5432/eqfal_ci
      REQUIRE_POSTGRES_TESTS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Normalize lockfile registry for CI
        run: |
          sed -i 's#http://package-firewall.replit.local/npm/#https://registry.npmjs.org/#g' package-lock.json
          if grep -q 'package-firewall.replit.local' package-lock.json; then
            echo 'Replit-internal registry URLs remain in package-lock.json'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Apply database migrations
        run: npx tsx server/src/db/migrate-cli.ts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
